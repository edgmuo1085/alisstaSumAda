<ion-content>
  <form [formGroup]="formDateSpecific" *ngIf="formDateSpecific">
    <ion-list lines="none">
      <!-- Fecha -->
      <ion-item lines="none">
        <ion-icon name="calendar-outline" slot="start"></ion-icon>
        <strong><label class="d-block">Fecha de asesoría específica</label></strong>
      </ion-item>

      <div *ngIf="showDateButton" class="ion-margin-bottom">
        <ion-datetime-button disabled datetime="startTodaySecific"></ion-datetime-button>
      </div>

      <ion-modal [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime
            id="startTodaySecific"
            placeholder="DD MMMM YYYY"
            presentation="date"
            display-format="DD MMM YYYY"
            monthShortNames="Enero, Febrero, Marzo, Abril, Mayo, Junio, Julio, Agosto, Septiembre, Octubre, Noviembre, Diciembre"
            color="primary"
            formControlName="startTodaySecific"
            mode="ios"
            class="ionDateTimeStart"
            cancelText="Cancelar"
          >
          </ion-datetime>
        </ng-template>
      </ion-modal>

      <ion-button
        expand="block"
        color="primary"
        [disabled]="disabledBtnDateStart"
        (click)="startTodaySpecific()"
        datetime="startTodaySecific"
      >
        INICIAR HOY ASESORIA ESPECIFICA
      </ion-button>

      <!-- Hora Inicio -->
      <ion-item lines="none" class="mt-3">
        <ion-icon name="time-outline" slot="start"></ion-icon>
        <ion-input
          readonly
          placeholder="Seleccionar hora Inicial"
          [value]="customStartDate ? formatForDisplay(customStartDate) : ''"
          (click)="openStartHour()"
        >
        </ion-input>
      </ion-item>

      <ion-modal [isOpen]="showStartHourModal" handle="false" class="center-modal" [backdropDismiss]="false" handle="false">
        <ng-template>
          <ion-datetime
            presentation="time"
            class="time-picker"
            [showDefaultButtons]="true"
            cancelText="Cancelar"
            doneText="Aceptar"
            (ionChange)="changeHourStar($event)"
            (ionCancel)="closeDateTimeModal('start')"
            (ionConfirm)="closeDateTimeModal('start')"
          >
          </ion-datetime>
        </ng-template>
      </ion-modal>

      <!-- Hora Final -->
      <ion-item class="mt-3">
        <ion-icon name="time-outline" slot="start"></ion-icon>
        <ion-input
          readonly
          placeholder="Seleccionar hora Final"
          [value]="customEndDate ? formatForDisplay(customEndDate) : ''"
          (click)="openEndHour()"
        >
        </ion-input>
      </ion-item>

      <ion-modal [isOpen]="showEndHourModal" handle="false" class="center-modal" [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime
            presentation="time"
            preferWheel="true"
            class="time-picker"
            [showDefaultButtons]="true"
            cancelText="Cancelar"
            doneText="Aceptar"
            (ionChange)="changeHourEnd($event)"
            (ionCancel)="showEndHourModal = false"
            (ionConfirm)="showEndHourModal = false"
          >
          </ion-datetime>
        </ng-template>
      </ion-modal>

      <!-- Contador de horas totales -->
      <ion-item class="mt-3">
        <strong>
          <ion-label *ngIf="!totalHours">Horas totales: 0</ion-label>
        </strong>
        <strong>
          <ion-label *ngIf="totalHours">Horas totales: {{ totalHours }}</ion-label>
        </strong>
      </ion-item>
    </ion-list>
  </form>
  <div class="text-center ion-margin"></div>
</ion-content>
