<ion-header class="header-custom" mode="md">
  <ion-toolbar color="tertiary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/" color="primary"></ion-back-button>
    </ion-buttons>

    <ion-title class="titulo"> Histórico de Actas Realizadas </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="backgroundContent">
  <ion-card *ngFor="let subject of subjects" mode="ios">
    <ion-card-header>
      <ion-card-title class="cardTitle"> {{ subject.idActividad }} </ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <p class="descripcion">{{ subject.descripcionActividad }}</p>

      <p class="horas">{{ subject.cantidadHorasEjecutar }} {{ subject.cantidadHorasEjecutar === 1 ? 'Hora' : 'Horas' }} de ejecución</p>

      <ion-button color="success" expand="block" shape="round" (click)="goToActivitySupport(subject.strUrlActa)">
        Previsualización
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
