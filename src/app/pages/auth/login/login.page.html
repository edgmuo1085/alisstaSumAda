<ion-content class="backgroundContent">
  <ion-grid>
    <!-- Logo autenticación  -->
    <ion-row>
      <ion-col>
        <img src="../../../../assets/logos/logo_alissta.png" alt="" />
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="12">
        <form [formGroup]="form" (ngSubmit)="login()">
          <ion-grid>
            <ion-row>
              <!-- Documento empleador -->
              <ion-col size="12">
                <div class="form-group">
                  <ion-input class="ion-text-center input digitoVerificacion" type="tel" inputmode="numeric"
                    placeholder="Documento empleador" formControlName="employerID">
                  </ion-input>
                </div>
                <div>
                  <span class="mensajeError"
                    *ngIf="!form.controls['employerID'].valid && form.controls['employerID'].touched">
                    Este campo es obligatorio
                  </span>
                </div>
              </ion-col>

              <!-- Documento usuario -->
              <ion-col size="12">
                <div class="form-group">
                  <ion-input class="ion-text-center input" type="tel" inputmode="numeric"
                    placeholder="Documento usuario" formControlName="userID">
                  </ion-input>
                </div>
                <div>
                  <span class="mensajeError" *ngIf="!form.controls['userID'].valid && form.controls['userID'].touched">
                    Este campo es obligatorio
                  </span>
                </div>
              </ion-col>

              <!-- Clave de acceso -->
              <ion-col size="12">
                <div class="form-group password-container mt-3">
                  <ion-input class="password-input" [type]="passwordType" inputmode="text" placeholder="Clave de acceso"
                    formControlName="password">
                  </ion-input>
                  <button type="button" class="btnShowPassword" (click)="togglePassword()">
                    <ion-icon class="iconShowPassword" slot="end" [name]="passwordToggleIcon"></ion-icon>
                  </button>
                </div>
                <div>
                  <span class="mensajeError"
                    *ngIf="!form.controls['password'].valid && form.controls['password'].touched">
                    Este campo es obligatorio
                  </span>
                </div>
              </ion-col>
            </ion-row>
          </ion-grid>
        </form>
      </ion-col>
    </ion-row>

    <!-- fila de los botones -->
    <ion-row>
      <ion-col size="12">
        <ion-button type="submit" expand="block" (click)="login()">INGRESAR</ion-button>
      </ion-col>
      <ion-col size="12" *ngIf="showFinger && activateFinger">
        <ion-button type="submit" color="secondary" expand="block" id="btnIngresoHuella"
          (click)="launchFingerprintModal()">
          <ion-icon slot="end" name="finger-print-outline"></ion-icon>
          Ingresar con FaceID/TouchID</ion-button>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="2"></ion-col>
      <ion-col size="10">
        <a (click)="forgotPassword()" class="olvidoPassword">¿Olvidó su contraseña?</a>
      </ion-col>
    </ion-row>
    <ion-col size="2"></ion-col>
    <!-- Logo positiva  -->
    <ion-row>
      <ion-col>
        <img class="logo" src="../../../../assets/logos/logo_positiva.png" alt="" />
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
