<app-header></app-header>

<ion-row *ngIf="progressBar.visible" class="ion-align-items-center ion-padding">
  <!-- Columna para el Progress Bar -->
  <ion-col size="9">
    <!-- <ion-progress-bar [value]="progressBar.progress"></ion-progress-bar> -->
    <ion-progress-bar [value]="progressBar.progress" [buffer]="progressBar.progress + 0.1"></ion-progress-bar>
  </ion-col>
  <!-- Columna para el label de actividades -->
  <ion-col size="3" class="ion-text-right">
    <ion-label>{{listActivity.length}}/{{listActivityTotal}}</ion-label>
  </ion-col>
</ion-row>

<ion-content class="backgroundContent">
  <ion-grid>
    <ion-row>
      <ion-col size="4" *ngFor="let menuOpt of optMenuOptions | async; let i = index">
        <ion-card mode="ios" (click)="optionSelectedMenu(menuOpt)" [routerLink]="menuOpt.redirecTo">
          <div class="vertical-center">
            <div class="center">
              <img [src]="menuOpt.icon" alt="" />
            </div>
          </div>
          <ion-label>
            <h4 class="tituloOpcion">{{menuOpt.title}}</h4>
          </ion-label>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-grid>
    <ion-row>
      <ion-col size="4" (click)="optionSelectedMenu(menuOptHelp)" *ngFor="let menuOptHelp of optMenuHelpOptions | async; let i = index">
        <div class="vertical-center">
          <div class="center">
            <img [src]="menuOptHelp.icon" alt="" />
          </div>
        </div>
        <ion-label>
          <h4 class="tituloOpcion"><strong>{{menuOptHelp.title | titlecase}}</strong></h4>
        </ion-label>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-row>
    <!-- <ion-col size="12">
      <div class="ion-text-center">
        <img class="imgIcono" src="../../../assets/icon/icono_observaciones.svg" alt="" />
      </div>
    </ion-col> -->
  </ion-row>
  <ion-row>
    <ion-col size="12" class="ion-text-center">
      <strong>
        <h4 class="titulo">
          Recuerda sincronizar las actividades migradas desde la web a la aplicación móvil, tocando el icono de la nube.
        </h4>
      </strong>
    </ion-col>
  </ion-row>
</ion-content>

<!-- Descargar visitas -->
<ion-fab vertical="bottom" horizontal="center" slot="fixed">
  <ion-fab-button (click)="listActivities()" [disabled]="progressBar.refreshBtnEnable">
    <ion-icon name="cloud-download-outline"></ion-icon>
  </ion-fab-button>
</ion-fab>
